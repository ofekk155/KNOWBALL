<div id="kbAuth" dir="rtl">
  <form class="card" id="kbForm" novalidate>
    <h1 dir="ltr">Know<span class="dot">Ball</span></h1>
    <p class="kb-tag" dir="ltr">The AI assistant for basketball coaches</p>
    <div id="kbTitle" style="font-weight:700; margin-bottom:4px;">כניסה</div>
    <label for="kbEmail">אימייל</label>
    <input id="kbEmail" type="email" autocomplete="email" dir="ltr" required>
    <div id="kbPassWrap">
      <label for="kbPass">סיסמה</label>
      <input id="kbPass" type="password" autocomplete="current-password" dir="ltr" minlength="6" required>
    </div>
    <div class="row"><button class="btn" type="submit" id="kbSubmit">כניסה</button></div>
    <div class="msg" id="kbMsg" role="status"></div>
    <div class="foot">
      <button class="link" type="button" id="kbToggle">אין לך חשבון? הרשמה</button>
      <button class="link" type="button" id="kbForgot">שכחתי סיסמה</button>
    </div>
  </form>
</div>
